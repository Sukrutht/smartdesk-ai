services:
  - type: web
    name: smartdesk-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CHROMA_PATH
        value: /tmp/chroma_data
      - key: DATABASE_URL
        value: sqlite:////tmp/smartdesk.db
      - key: MAX_UPLOAD_MB
        value: "10"
